server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # Routing SPA : tout retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long sur les assets hashés par Vite (immutables)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html ne doit jamais être mis en cache
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
